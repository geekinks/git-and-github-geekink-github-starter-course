name: Validate training data

'on':
  pull_request:
    paths:
      - "config/**"
      - "courses/**"
      - "cohorts/**"
      - "students/**"
      - "tracking/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "courses/**"
      - "cohorts/**"
      - "students/**"
      - "tracking/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-training-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate configuration and references
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
