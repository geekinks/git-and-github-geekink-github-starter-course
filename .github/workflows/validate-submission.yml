name: Validate assignment submissions

'on':
  pull_request:
    paths:
      - "tracking/submissions/**"

permissions:
  contents: read

concurrency:
  group: validate-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out untrusted pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate changed submission records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' path; do
            case "$path" in
              tracking/submissions/*.yml|tracking/submissions/*.yaml)
                found=1
                python scripts/validate_assignment.py "$path"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- tracking/submissions)
          if [[ "$found" -eq 0 ]]; then
            echo "No new or changed YAML submission records were found."
            exit 1
          fi
      - name: Explain review state
        run: echo "Automated checks do not approve an assignment. An instructor review is still required."
