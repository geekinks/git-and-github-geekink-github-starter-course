name: Generate cohort reports

'on':
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths:
      - "cohorts/**"
      - "students/**"
      - "tracking/**"
      - "courses/**"
      - "scripts/generate_report.py"
      - "scripts/training_core.py"

permissions:
  contents: read

concurrency:
  group: generate-training-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate before reporting
        run: python scripts/validate_data.py
      - name: Generate deterministic reports
        run: python scripts/generate_report.py
      - name: Upload private report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cohort-reports-${{ github.run_id }}
          path: reports/generated
          if-no-files-found: error
          retention-days: 30
