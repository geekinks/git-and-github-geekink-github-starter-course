name: Instructor review queue item
description: Instructor-only review checklist for work that passed automated checks.
title: "Review: submission-id"
labels: [instructor-review]
body:
  - type: input
    id: submission_id
    attributes: {label: Submission ID}
    validations: {required: true}
  - type: checkboxes
    id: review
    attributes:
      label: Review checklist
      options:
        - label: Automated checks passed or their limitations were reviewed.
          required: true
        - label: Learning objectives were assessed by a human.
          required: true
        - label: Feedback contains no private student information.
          required: true
  - type: dropdown
    id: decision
    attributes: {label: Decision, options: [Changes requested, Approved]}
    validations: {required: true}
  - type: textarea
    id: feedback
    attributes: {label: Feedback}
    validations: {required: true}
